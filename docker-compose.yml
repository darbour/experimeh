version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: experimeh-postgres
    environment:
      POSTGRES_DB: experimeh_test
      POSTGRES_USER: experimeh
      POSTGRES_PASSWORD: test_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experimeh"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - experimeh-network

  redis:
    image: redis:7-alpine
    container_name: experimeh-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - experimeh-network

volumes:
  postgres_data:

networks:
  experimeh-network:
    driver: bridge
